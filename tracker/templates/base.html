<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продвинутый Калькулятор Сроков Годности</title>
    
    <!-- Подключение официальных стилей и иконок Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <!-- НАДЁЖНЫЕ АВТОРСКИЕ СТИЛИ ДЛЯ ТЕМНОЙ ТЕМЫ -->
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        
        /* Стили, которые применятся, когда у body будет класс dark-mode */
        body.dark-mode {
            background-color: #121824 !important;
            color: #e3e8f0 !important;
        }
        body.dark-mode .card {
            background-color: #1a2333 !important;
            color: #e3e8f0 !important;
            border: 1px solid #2d3d57 !important;
        }
        body.dark-mode .table {
            color: #e3e8f0 !important;
        }
        body.dark-mode .table-light {
            background-color: #243147 !important;
            color: #ffffff !important;
        }
        body.dark-mode td {
            background-color: #1a2333 !important;
            color: #e3e8f0 !important;
            border-bottom-color: #2d3d57 !important;
        }
        body.dark-mode .input-group-text, body.dark-mode .form-control, body.dark-mode .form-select {
            background-color: #243147 !important;
            color: #ffffff !important;
            border-color: #2d3d57 !important;
        }
        body.dark-mode .form-control::placeholder {
            color: #a0aec0 !important;
        }
    </style>
</head>
<body>

    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <!-- Исправлено имя маршрута на products_list -->
            <a class="navbar-brand" href="{% url 'products_list' %}">🍏 FreshManager.Pro</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    {% if user.is_authenticated %}
                        <!-- Исправлено имя маршрута на products_list -->
                        <li class="nav-item"><a class="nav-link" href="{% url 'products_list' %}">📋 Склад продуктов</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'add_product' %}">➕ Новый расчет</a></li>
                    {% endif %}
                </ul>
                <div class="d-flex align-items-center">
                    
                    <!-- НАДЕЖНАЯ КНОПКА СМЕНЫ ТЕМЫ ДЕНЬ/НОЧЬ -->
                    <button class="btn btn-outline-light me-3 btn-sm" id="themeToggler" type="button">
                        <span id="themeBtnText">🌙 Темная тема</span>
                    </button>

                    {% if user.is_authenticated %}
                        <span class="navbar-text text-white me-3">👤 {{ user.username }}</span>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                        </form>
                    {% else %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Войти</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- ОБНОВЛЕННЫЙ СКРИПТ ПЕРЕКЛЮЧЕНИЯ КЛАССОВ -->
    <script>
        const themeToggler = document.getElementById('themeToggler');
        const themeBtnText = document.getElementById('themeBtnText');
        const bodyTag = document.body;

        // 1. Проверяем сохраненную тему в кэше браузера при загрузке страницы
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            bodyTag.classList.add('dark-mode');
        }
        updateButtonInterface(savedTheme);

        // 2. Обработчик клика по кнопке
        themeToggler.addEventListener('click', function() {
            const isDark = bodyTag.classList.contains('dark-mode');
            
            if (isDark) {
                bodyTag.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
                updateButtonInterface('light');
            } else {
                bodyTag.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
                updateButtonInterface('dark');
            }
        });

        // Функция изменения текста на кнопке в зависимости от активного режима
        function updateButtonInterface(theme) {
            if (theme === 'dark') {
                themeBtnText.innerText = '☀️ Светлая тема';
            } else {
                themeBtnText.innerText = '🌙 Темная тема';
            }
        }
    </script>
    
    <!-- Скрипты Bootstrap для работы адаптивных элементов -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
